name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 验证 tag 版本号与 Cargo.toml 一致
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 获取 Cargo.toml 中的版本号
        id: get-version
        shell: bash
        run: |
          CARGO_VERSION=$(grep '^version =' src-tauri/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Cargo version: $CARGO_VERSION"
          echo "Tag version: $TAG_VERSION"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::版本号不匹配：Cargo.toml ($CARGO_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi
          echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"

  # 跨平台构建
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''

          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '-- --target x86_64-apple-darwin'

          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 依赖
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libpipewire-0.3-dev \
            libgbm-dev

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Tauri 应用
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run tauri build ${{ matrix.args }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error

  # 创建 Draft Release 并上传所有平台的构建产物
  publish:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 设置版本号
        id: version
        shell: bash
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: false

      - name: 列出产物文件
        shell: bash
        run: |
          echo "=== 所有产物 ==="
          find release-artifacts -type f | sort
          echo ""
          echo "=== 目录结构 ==="
          find release-artifacts -type d | sort

      - name: 整理产物到统一目录
        shell: bash
        run: |
          mkdir -p upload
          # 只复制发行包文件（排除 .app 目录内数百个内部文件）
          find release-artifacts -type f \( \
            -name "*.exe" -o \
            -name "*.dmg" -o \
            -name "*.AppImage" -o \
            -name "*.tar.gz" -o \
            -name "*.deb" -o \
            -name "*.sig" \
          \) | while read -r f; do
            cp "$f" upload/
          done
          echo "=== 待上传文件 ==="
          ls -lh upload/

      - name: 清理旧 Draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          EXISTING_ID=$(gh api repos/${{ github.repository }}/releases \
            --jq ".[] | select(.tag_name==\"$TAG\" and .draft) | .id" | head -1)
          if [ -n "$EXISTING_ID" ]; then
            echo "删除旧的 Draft Release (ID: $EXISTING_ID)"
            gh api repos/${{ github.repository }}/releases/$EXISTING_ID -X DELETE
          fi

      - name: 创建 Draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "SnapTranslate ${{ steps.version.outputs.tag }}" \
            --notes "构建中，请稍候..." \
            --draft \
            --repo "${{ github.repository }}"

      - name: 上传产物到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file in upload/*; do
            echo "上传: $file ($(du -h "$file" | cut -f1))"
            gh release upload "${{ steps.version.outputs.tag }}" "$file" \
              --repo "${{ github.repository }}" --clobber
          done
          echo "=== 上传完成 ==="

      - name: 生成 latest.json（更新用清单）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          VERSION="${VERSION#v}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO="${{ github.repository }}"
          TAG="${{ steps.version.outputs.tag }}"

          # 获取 release ID
          RELEASE_ID=$(gh api repos/$REPO/releases --jq ".[] | select(.tag_name==\"$TAG\" and .draft) | .id")

          # 获取已上传的 assets
          gh api repos/$REPO/releases/$RELEASE_ID/assets --jq '.[].name' > /tmp/assets.txt
          echo "已上传的 assets:"
          cat /tmp/assets.txt

          # 构建 platforms 对象
          PLATFORMS="{"
          SEP=""

          # Windows
          if grep -q "x64-setup.exe" /tmp/assets.txt; then
            ASSET_NAME=$(grep "x64-setup.exe" /tmp/assets.txt | head -1)
            SIG_NAME="${ASSET_NAME}.sig"
            SIG_URL="https://github.com/$REPO/releases/download/$TAG/$SIG_NAME"
            DL_URL="https://github.com/$REPO/releases/download/$TAG/$ASSET_NAME"
            # 下载签名
            curl -sL -o /tmp/windows.sig "$SIG_URL"
            if [ -f /tmp/windows.sig ]; then
              SIGNATURE=$(cat /tmp/windows.sig)
              PLATFORMS="${PLATFORMS}${SEP}\"windows-x86_64\": {\"signature\": \"$SIGNATURE\", \"url\": \"$DL_URL\"}"
              SEP=", "
            fi
          fi

          # macOS
          if grep -q "x64.dmg" /tmp/assets.txt; then
            ASSET_NAME=$(grep "x64.dmg" /tmp/assets.txt | head -1)
            SIG_NAME=$(grep "x64.app.tar.gz.sig" /tmp/assets.txt | head -1)
            if [ -n "$SIG_NAME" ]; then
              SIG_URL="https://github.com/$REPO/releases/download/$TAG/$SIG_NAME"
              DL_URL="https://github.com/$REPO/releases/download/$TAG/$ASSET_NAME"
              curl -sL -o /tmp/macos.sig "$SIG_URL"
              if [ -f /tmp/macos.sig ]; then
                SIGNATURE=$(cat /tmp/macos.sig)
                PLATFORMS="${PLATFORMS}${SEP}\"darwin-x86_64\": {\"signature\": \"$SIGNATURE\", \"url\": \"$DL_URL\"}"
                SEP=", "
              fi
            fi
          fi

          # Linux
          if grep -q "amd64.AppImage" /tmp/assets.txt; then
            ASSET_NAME=$(grep "amd64.AppImage" /tmp/assets.txt | head -1)
            SIG_NAME="${ASSET_NAME}.sig"
            SIG_URL="https://github.com/$REPO/releases/download/$TAG/$SIG_NAME"
            DL_URL="https://github.com/$REPO/releases/download/$TAG/$ASSET_NAME"
            curl -sL -o /tmp/linux.sig "$SIG_URL"
            if [ -f /tmp/linux.sig ]; then
              SIGNATURE=$(cat /tmp/linux.sig)
              PLATFORMS="${PLATFORMS}${SEP}\"linux-x86_64\": {\"signature\": \"$SIGNATURE\", \"url\": \"$DL_URL\"}"
              SEP=", "
            fi
          fi

          PLATFORMS="${PLATFORMS}}"

          # 生成 latest.json
          cat > /tmp/latest.json << EOF
          {
            "version": "$VERSION",
            "notes": "SnapTranslate $VERSION",
            "pub_date": "$PUB_DATE",
            "platforms": $PLATFORMS
          }
          EOF

          # 美化输出
          cat /tmp/latest.json | python3 -m json.tool > /tmp/latest_pretty.json 2>/dev/null || cp /tmp/latest.json /tmp/latest_pretty.json
          echo "生成的 latest.json:"
          cat /tmp/latest_pretty.json

          # 上传 latest.json
          gh release upload "$TAG" /tmp/latest_pretty.json \
            --repo "$REPO" --clobber
